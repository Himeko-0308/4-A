<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>JavaScriptの練習</title>
  </head>
  <body>
    <p>ページ</p>
    <button onclick="myFunc();">Hello</button>
    <script>
      console.log(2 ** 3);

      function myFunc() {
        const tax = 500 * 0.08;
        document.write("500円の消費税（8%）は" + tax + "円です");
      }
    </script>
  </body>
</html>
